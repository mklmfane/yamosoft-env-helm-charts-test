---
# Used as the VirtualBox VM-name prefix.
cluster_name: "Kubernetes Cluster"

# Uncomment to pass proxy variables to services such as CRI-O and kubelet.
# environment: |
#   HTTP_PROXY=http://my-proxy:8000
#   HTTPS_PROXY=http://my-proxy:8000
#   NO_PROXY=127.0.0.1,localhost,controlplane,node01,node02,jenkins,gha-runner

# All IPs/CIDRs must be private and allowed by /etc/vbox/networks.conf.
network:
  # Worker addresses are incremented from the control-plane address.
  control_ip: "192.168.56.10"
  pod_cidr: "172.16.1.0/16"
  service_cidr: "172.17.1.0/18"

  jenkins_ip: "192.168.56.20"
  jenkins_port: 8080
  jenkins_ssh_port: 2222

  github_actions_ip: "192.168.56.30"
  github_actions_port: 8081
  github_actions_ssh_port: 2223

  dns_servers:
    - "8.8.8.8"
    - "1.1.1.1"

nodes:
  control:
    cpu: 2
    memory: 3096

  workers:
    count: 2
    cpu: 1
    memory: 1024

  jenkins:
    cpu: 2
    memory: 2048

  github_actions:
    cpu: 2
    memory: 4096

# Never store GITHUB_PAT in this file. The Vagrantfile reads it from the host
# environment or from ~/.config/github/gha-runner.pat (which must be mode 600).
software:
  box: "bento/ubuntu-24.04"
  calico: "3.30.3"
  os: "ubuntu"
  kubernetes: "1.34.*"

  jenkins:
    port: 8080

  github_actions:
    version: "2.336.0"
    sha256: "04cf0be1aff4c3ec3554466c39124ca250e3effd8873bb7e8d68535aa9505d5d"
    repository_url: "https://github.com/mklmfane/skills-introduction-to-github"
    runner_name: "gha-runner"
    labels: "vagrant,virtualbox,github-skills"
    work_folder: "_work"